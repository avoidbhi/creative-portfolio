<p class="line">New York, 100 inches wide.</p>
<p>A redesign of <em>Here is New York</em> — E.B. White’s 1949 love letter to the city — as a 100-inch accordion-fold book.</p>
<p>The text unfolds across a map of Manhattan; the city becomes the page. What White did with words in 1949, the foldout does with the street grid.</p>
